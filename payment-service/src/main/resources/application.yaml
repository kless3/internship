spring:
  application:
    name: payment-service

  data:
    mongodb:
      host: localhost
      port: 27017
      database: payment

  liquibase-mongodb:
    enabled: true
    change-log: db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: localhost:9092
    consumer-group-id: payment-service
    trusted-packages: "*"
    default-type: com.internship.payment_service.dto.event.OrderCreatedEvent

logging:
  level:
    liquibase: DEBUG
    org.springframework.boot.autoconfigure.liquibase: DEBUG
    org.mongodb.driver: DEBUG

server:
  port: 8084

external:
  api:
    url: https://www.random.org/integers/?num=1&min=1&max=1000&col=1&base=10&format=plain&rnd=new