image: maven:3.9.9-eclipse-temurin-21

stages:
  - build
  - test
  - sonarqube-check
  - docker-build

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

cache:
  paths:
    - .m2/repository
    - target/*.jar

build:
  stage: build
  script:
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - target/classes/
    expire_in: 1 hour

test:
  stage: test
  script:
    - mvn test
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 1 week

sonarcloud-check:
  image: maven:3-openjdk-17
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - mvn verify sonar:sonar -Dsonar.projectKey=kless3_internship2
  only:
    - merge_requests
    - master
    - develop



docker-build:
  stage: docker-build
  image: docker:20.10.24
  services:
    - docker:20.10.24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
  script:
    - docker login -u $DOCKER_REGISTRY_USER -p $DOCKER_REGISTRY_PASSWORD $DOCKER_REGISTRY_URL
    - docker build -t $DOCKER_REGISTRY_URL/user-service:${CI_COMMIT_SHORT_SHA} .
    - docker push $DOCKER_REGISTRY_URL/user-service:${CI_COMMIT_SHORT_SHA}
    - echo "Docker image pushed: $DOCKER_REGISTRY_URL/user-service:${CI_COMMIT_SHORT_SHA}"
  only:
    - main
    - tags