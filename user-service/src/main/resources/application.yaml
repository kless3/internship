spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/internship
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 60000
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

server:
  port: 8080

auth:
  service:
    url: http://localhost:8081

logging:
  level:
    com.internship.user_service: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
