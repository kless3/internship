spring.application.name=order-service
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

spring.liquibase.enabled=true

spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.trusted-packages=*
spring.kafka.default-type=com.internship.order_service.dto.event.PaymentCreatedEvent

spring.kafka.consumer-group-id=${CONSUMER_GROUP_ID}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.internship.order_service.dto.event.PaymentCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

app.messaging.transport=${MESSAGING_TRANSPORT:sqs}
spring.sqs.order-created-queue-name=${ORDER_CREATED_QUEUE_NAME:order-created.fifo}
spring.sqs.payment-created-queue-name=${PAYMENT_CREATED_QUEUE_NAME:payment-created.fifo}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:test}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:test}
spring.cloud.aws.region.static=${AWS_DEFAULT_REGION:eu-central-1}
spring.cloud.aws.sqs.endpoint=${AWS_SQS_ENDPOINT:http://localhost:4566}
spring.cloud.aws.sqs.region=${AWS_DEFAULT_REGION:eu-central-1}
spring.cloud.aws.sqs.listener.max-messages-per-poll=${SQS_MAX_MESSAGES:5}
spring.cloud.aws.sqs.listener.poll-timeout=${SQS_WAIT_TIME_SECONDS:5}s

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8085/realms/internship/protocol/openid-connect/certs}
