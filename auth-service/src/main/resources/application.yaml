spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  sql:
    init:
      mode: always
      platform: postgres

server:
  port: 8081

user:
  service:
    url: http://localhost:8080

jwt:
  secret: "mySuperSecretKeyForJWTGenerationThatIsAtLeast32BytesLong123!"
  access-token:
    expiration: 3600000
  refresh-token:
    expiration: 2592000000

logging:
  level:
    com.internship.auth_service: DEBUG
    org.springframework.security: INFO