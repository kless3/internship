name: CI for Microservices

on:
  push:
    branches: [ order-service ]
  pull_request:
    branches: [ order-service ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ['auth-service', 'user-service', 'order-service']
        include:
          - service: 'auth-service'
            build-tool: 'maven'
          - service: 'user-service'
            build-tool: 'maven'
          - service: 'order-service'
            build-tool: 'gradle'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ matrix.build-tool }}
          cache-dependency-path: ${{ matrix.service }}/

      - name: Build
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ matrix.build-tool }}" = "maven" ]; then
            mvn clean compile -B
          else
            ./gradlew clean compileJava -x test
          fi

      - name: Run Unit Tests
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ matrix.build-tool }}" = "maven" ]; then
            mvn test -B
          else
            ./gradlew test -x integrationTest
          fi

      - name: Run Integration Tests
        working-directory: ${{ matrix.service }}
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
        run: |
          if [ "${{ matrix.build-tool }}" = "maven" ]; then
            mvn verify -DskipUnitTests -B
          else
            ./gradlew integrationTest -x test
          fi

      - name: Generate Code Coverage
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ matrix.build-tool }}" = "maven" ]; then
            mvn jacoco:report -B
          else
            ./gradlew jacocoTestReport -x test -x integrationTest
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
            ${{ matrix.service }}/target/site/jacoco/
          retention-days: 7