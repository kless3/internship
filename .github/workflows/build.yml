name: CI Pipeline

on:
  push:
    branches: [ order-service, payment-service ]
  pull_request:
    branches: [ order-service, payment-service ]

env:
  REGISTRY: MaksimYafimchyk
  SERVICES: "auth-service user-service order-service payment-service"
  IMAGE_NAME: MaksimYafimchyk/internship

jobs:
  build-and-test:
    name: Build and Test Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      mongodb:
        image: mongo:7.0
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5
        ports:
          - 27017:27017

      kafka:
        image: apache/kafka:3.7.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
          - 9092:9092

    strategy:
      matrix:
        service: [ user-service, auth-service, order-service, payment-service ]
        include:
          - service: auth-service
            db_name: auth
            db_schema: auth_schema
            build_tool: maven
          - service: user-service
            db_name: internship
            db_schema: user_schema
            build_tool: maven
          - service: order-service
            db_name: order_db
            db_schema: order_schema
            build_tool: gradle
          - service: payment-service
            db_name: payment
            build_tool: maven

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make gradlew executable (for order-service)
        if: matrix.service == 'order-service'
        run: |
          cd order-service
          chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ matrix.build_tool }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database and schema for ${{ matrix.service }}
        if: matrix.service != 'payment-service'
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE ${{ matrix.db_name }};"
          
          psql postgresql://postgres:postgres@localhost:5432/${{ matrix.db_name }} -c "CREATE SCHEMA IF NOT EXISTS ${{ matrix.db_schema }};"
          
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "\l" | grep ${{ matrix.db_name }}
          psql postgresql://postgres:postgres@localhost:5432/${{ matrix.db_name }} -c "\dn" | grep ${{ matrix.db_schema }}

      - name: Wait for MongoDB to be ready (for payment-service)
        if: matrix.service == 'payment-service'
        run: |
          echo "Waiting for MongoDB..."
          until echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet; do
            sleep 2
          done
          echo "MongoDB is ready!"

      - name: Wait for Kafka to be ready
        if: matrix.service == 'order-service' || matrix.service == 'payment-service'
        run: |
          echo "Waiting for Kafka..."
          until kafka-topics --bootstrap-server localhost:9092 --list; do
            sleep 5
          done
          echo "Kafka is ready!"

      - name: Build ${{ matrix.service }} with ${{ matrix.build_tool }}
        run: |
          cd ${{ matrix.service }}
          if [ "${{ matrix.build_tool }}" = "maven" ]; then
            mvn clean compile -DskipTests
          else
            ./gradlew compileJava -x test
          fi

      - name: Run tests with JaCoCo for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          if [ "${{ matrix.build_tool }}" = "maven" ]; then
            mvn clean test jacoco:report -Djacoco.destDir=target/site/jacoco
          else
            ./gradlew test jacocoTestReport
          fi

      - name: Verify database connectivity for ${{ matrix.service }}
        if: matrix.service != 'payment-service'
        run: |
          echo "Testing connection to database: ${{ matrix.db_name }}"
          psql postgresql://postgres:postgres@localhost:5432/${{ matrix.db_name }} -c "SELECT current_database(), current_schema();"

      - name: Verify MongoDB connectivity for payment-service
        if: matrix.service == 'payment-service'
        run: |
          echo "Testing connection to MongoDB"
          echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet

  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build all services for Sonar
        run: |
          cd user-service && mvn clean verify -DskipTests
          cd ../auth-service && mvn clean verify -DskipTests
          cd ../payment-service && mvn clean verify -DskipTests

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          cd user-service
          mvn sonar:sonar \
            -Dsonar.organization=kless31332 \
            -Dsonar.projectKey=kless3_internship \
            -Dsonar.projectName='User Service' \
            -Dsonar.qualitygate.wait=false \
            -Dsonar.issue.ignore.multicriteria=e1 \
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=squid:S00116 \
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*
          
          cd ../auth-service
          mvn sonar:sonar \
            -Dsonar.organization=kless31332 \
            -Dsonar.projectKey=kless3_internship \
            -Dsonar.projectName='Auth Service' \
            -Dsonar.qualitygate.wait=false \
            -Dsonar.issue.ignore.multicriteria=e1 \
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=squid:S00116 \
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*

          cd ../payment-service
          mvn sonar:sonar \
            -Dsonar.organization=kless31332 \
            -Dsonar.projectKey=kless3_internship \
            -Dsonar.projectName='Payment Service' \
            -Dsonar.qualitygate.wait=false \
            -Dsonar.issue.ignore.multicriteria=e1 \
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=squid:S00116 \
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*

  docker-build:
    name: Artifact Creation (Docker Images)
    runs-on: ubuntu-latest
    needs: code-analysis
    if: github.event_name == 'push' && github.ref == 'refs/heads/order-service'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [ user-service, auth-service, order-service, payment-service ]
        include:
          - service: auth-service
            build_tool: maven
            context: ./auth-service
            port: 8081
          - service: user-service
            build_tool: maven
            context: ./user-service
            port: 8080
          - service: order-service
            build_tool: gradle
            context: ./order-service
            port: 8082
          - service: payment-service
            build_tool: maven
            context: ./payment-service
            port: 8084

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ matrix.build_tool }}

      - name: Make gradlew executable (for order-service)
        if: matrix.service == 'order-service'
        run: |
          cd order-service
          chmod +x ./gradlew

      - name: Build ${{ matrix.service }} with ${{ matrix.build_tool }}
        run: |
          cd ${{ matrix.service }}
          if [ "${{ matrix.build_tool }}" = "maven" ]; then
            mvn clean package -DskipTests
          else
            ./gradlew build -x test
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker artifacts for ${{ matrix.service }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.service }}
          path: ${{ matrix.context }}

      - name: Generate deployment manifest
        run: |
          cat > docker-compose.prod.yml << EOF
          version: '3.8'
          services:
            user-service:
              image: ghcr.io/${{ github.repository_owner }}/user-service:latest
              ports: ["8080:8080"]
            auth-service:
              image: ghcr.io/${{ github.repository_owner }}/auth-service:latest
              ports: ["8081:8081"]
            order-service:
              image: ghcr.io/${{ github.repository_owner }}/order-service:latest
              ports: ["8082:8082"]
            payment-service:
              image: ghcr.io/${{ github.repository_owner }}/payment-service:latest
              ports: ["8084:8084"]
          EOF

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: docker-compose.prod.yml
          retention-days: 30