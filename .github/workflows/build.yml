name: CI Pipeline for Order Service Branch

on:
  push:
    branches: [ order-service ]
  pull_request:
    branches: [ order-service ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build and Test Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        service:
          - path: "user-service"
            name: "userservice"
          - path: "auth-service"
            name: "authenticationservice"
          - path: "order-service"
            name: "orderservice"

    steps:
      - name: Checkout code from order-service branch
        uses: actions/checkout@v4
        with:
          ref: order-service
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        if: matrix.service.path == 'order-service'
        run: chmod +x ./order-service/gradlew

      - name: Create separate databases for each service
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE auth;" || echo "Database auth might already exist"
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE internship;" || echo "Database internship might already exist"
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE order_db;" || echo "Database order_db might already exist"
          echo "Databases created/verified successfully"

      - name: Cache Maven dependencies
        if: matrix.service.path == 'user-service' || matrix.service.path == 'auth-service'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache Gradle dependencies
        if: matrix.service.path == 'order-service'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build ${{ matrix.service.name }}
        run: |
          cd ${{ matrix.service.path }}
          if [ -f "pom.xml" ]; then
            echo "Building Maven project: ${{ matrix.service.path }}"
            mvn clean compile -DskipTests
          elif [ -f "build.gradle" ]; then
            echo "Building Gradle project: ${{ matrix.service.path }}"
            chmod +x ../gradlew
            ../gradlew clean build -x test --info
          fi

      - name: Run Unit Tests for ${{ matrix.service.name }}
        run: |
          cd ${{ matrix.service.path }}
          if [ -f "pom.xml" ]; then
            echo "Running Maven tests: ${{ matrix.service.path }}"
            mvn test jacoco:report
          elif [ -f "build.gradle" ]; then
            echo "Running Gradle tests: ${{ matrix.service.path }}"
            chmod +x ../gradlew
            ../gradlew test jacocoTestReport --info
          fi

      - name: Verify test results for ${{ matrix.service.name }}
        run: |
          cd ${{ matrix.service.path }}
          echo "=== Test Results for ${{ matrix.service.path }} ==="
          if [ -f "pom.xml" ]; then
            ls -la target/surefire-reports/ || echo "No Maven test reports"
            ls -la target/site/jacoco/ || echo "No Maven JaCoCo reports"
          elif [ -f "build.gradle" ]; then
            ls -la build/test-results/test/ || echo "No Gradle test results"
            ls -la build/reports/jacoco/ || echo "No Gradle JaCoCo reports"
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service.name }}-order-service
          path: |
            ${{ matrix.service.path }}/target/surefire-reports/
            ${{ matrix.service.path }}/target/site/jacoco/
            ${{ matrix.service.path }}/build/test-results/
            ${{ matrix.service.path }}/build/reports/
          retention-days: 30

  sonar-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code from order-service branch
        uses: actions/checkout@v4
        with:
          ref: order-service
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        run: chmod +x ./order-service/gradlew

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-order-service
          restore-keys: ${{ runner.os }}-sonar-order-service

      - name: Run Sonar analysis for all services together
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Running Sonar analysis for all services in single project..."
          
          # Собираем все сервисы и генерируем отчеты покрытия
          echo "Building User Service with coverage..."
          cd user-service
          mvn clean test jacoco:report -DskipTests=false
          
          echo "Building Auth Service with coverage..."
          cd ../auth-service
          mvn clean test jacoco:report -DskipTests=false
          
          echo "Building Order Service with coverage..."
          cd ../order-service
          chmod +x ../gradlew
          ../gradlew clean test jacocoTestReport --info
          
          # Возвращаемся в корень и запускаем Sonar для всего проекта
          cd ..
          
          # Создаем общий sonar-project.properties
          cat > sonar-project.properties << EOF
          sonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          sonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          sonar.host.url=https://sonarcloud.io
          sonar.branch.name=order-service
          sonar.sources=user-service/src/main/java,auth-service/src/main/java,order-service/src/main/java
          sonar.tests=user-service/src/test/java,auth-service/src/test/java,order-service/src/test/java
          sonar.java.binaries=user-service/target/classes,auth-service/target/classes,order-service/build/classes
          sonar.java.libraries=user-service/target/*.jar,auth-service/target/*.jar,order-service/build/libs/*.jar
          sonar.coverage.jacoco.xmlReportPaths=user-service/target/site/jacoco/jacoco.xml,auth-service/target/site/jacoco/jacoco.xml,order-service/build/reports/jacoco/test/jacocoTestReport.xml
          sonar.junit.reportPaths=user-service/target/surefire-reports/*.xml,auth-service/target/surefire-reports/*.xml,order-service/build/test-results/test/*.xml
          sonar.sourceEncoding=UTF-8
          EOF
          
          # Запускаем Sonar сканер
          mvn sonar:sonar -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
                         -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
                         -Dsonar.branch.name=order-service

  artifact-creation:
    name: Create Artifacts
    runs-on: ubuntu-latest
    needs: sonar-analysis
    if: github.ref == 'refs/heads/order-service'

    strategy:
      matrix:
        service:
          - path: "user-service"
            name: "userservice"
          - path: "auth-service"
            name: "authservice"
          - path: "order-service"
            name: "orderservice"

    steps:
      - name: Checkout code from order-service branch
        uses: actions/checkout@v4
        with:
          ref: order-service

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        if: matrix.service.path == 'order-service'
        run: chmod +x ./order-service/gradlew

      - name: Build JAR for ${{ matrix.service.name }}
        run: |
          cd ${{ matrix.service.path }}
          if [ -f "pom.xml" ]; then
            echo "Building Maven JAR: ${{ matrix.service.path }}"
            mvn clean package -DskipTests
          elif [ -f "build.gradle" ]; then
            echo "Building Gradle JAR: ${{ matrix.service.path }}"
            chmod +x ../gradlew
            ../gradlew clean build -x test --info
          fi

      - name: Upload JAR artifacts from order-service branch
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.name }}-jar-order-service
          path: |
            ${{ matrix.service.path }}/target/*.jar
            ${{ matrix.service.path }}/build/libs/*.jar
          retention-days: 30

      - name: Create deployment package
        run: |
          cd ${{ matrix.service.path }}
          mkdir -p deployment
          
          if [ -f "pom.xml" ]; then
            cp target/*.jar deployment/ 2>/dev/null || echo "No JAR files found"
            cp -r src/main/resources/* deployment/ 2>/dev/null || true
          elif [ -f "build.gradle" ]; then
            cp build/libs/*.jar deployment/ 2>/dev/null || echo "No JAR files found"
            cp -r src/main/resources/* deployment/ 2>/dev/null || true
          fi
          
          echo "Service: ${{ matrix.service.name }}" > deployment/version.txt
          echo "Path: ${{ matrix.service.path }}" >> deployment/version.txt
          echo "Branch: order-service" >> deployment/version.txt
          echo "Build: ${{ github.sha }}" >> deployment/version.txt
          echo "Date: $(date)" >> deployment/version.txt

      - name: Upload deployment packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.name }}-deployment-order-service
          path: ${{ matrix.service.path }}/deployment/**
          retention-days: 30