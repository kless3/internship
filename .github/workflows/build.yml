name: User Service CI Pipeline

on:
  push:
    branches: [ user-service, dev ]
  pull_request:
    branches: [ user-service, dev ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          if [ -d "user-service" ]; then
            cd user-service
            mvn clean compile -DskipTests
          else
            mvn clean compile -DskipTests
          fi

  test:
    name: Testing
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopdb
          POSTGRES_USER: shop_user
          POSTGRES_PASSWORD: shop_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run unit tests
        run: |
          if [ -d "user-service" ]; then
            cd user-service
            mvn test -DskipITs
          else
            mvn test -DskipITs
          fi
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shopdb
          DATABASE_USERNAME: shop_user
          DATABASE_PASSWORD: shop_password
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 30
          if-no-files-found: warn

  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Debug - Show project structure
        run: |
          echo "=== Project Structure ==="
          find . -name "pom.xml" -o -name "*.java" -o -name "target" | head -30
          echo "=== Current directory contents ==="
          ls -la
          echo "=== Checking for source directories ==="
          find . -type d -name "java" | head -10

      - name: Build project
        run: |
          # Сначала найдем где находится pom.xml
          if [ -f "pom.xml" ]; then
            echo "Building from root directory"
            mvn clean compile test -DskipITs
          elif [ -d "user-service" ] && [ -f "user-service/pom.xml" ]; then
            echo "Building from user-service directory"
            cd user-service
            mvn clean compile test -DskipITs
          else
            echo "Searching for pom.xml..."
            POM_FILE=$(find . -name "pom.xml" | head -1)
            if [ -n "$POM_FILE" ]; then
              POM_DIR=$(dirname "$POM_FILE")
              echo "Building from $POM_DIR"
              cd "$POM_DIR"
              mvn clean compile test -DskipITs
            else
              echo "ERROR: No pom.xml found"
              exit 1
            fi
          fi

      - name: Find and set project paths
        id: find_paths
        run: |
          # Определяем базовую директорию проекта
          if [ -f "pom.xml" ]; then
            PROJECT_BASE="."
          elif [ -d "user-service" ] && [ -f "user-service/pom.xml" ]; then
            PROJECT_BASE="user-service"
          else
            POM_FILE=$(find . -name "pom.xml" | head -1)
            PROJECT_BASE=$(dirname "$POM_FILE")
          fi
          
          echo "Project base: $PROJECT_BASE"
          cd "$PROJECT_BASE"
          
          # Находим реальные пути
          SOURCE_DIR=$(find . -type d -path "*/src/main/java" | head -1)
          TEST_DIR=$(find . -type d -path "*/src/test/java" | head -1)
          TARGET_DIR="target"
          
          # Если не нашли стандартные пути, ищем альтернативы
          if [ -z "$SOURCE_DIR" ]; then
            SOURCE_DIR=$(find . -type d -name "java" | grep -v test | head -1)
          fi
          
          if [ -z "$TEST_DIR" ]; then
            TEST_DIR=$(find . -type d -name "java" | grep test | head -1)
          fi
          
          echo "source_dir=$SOURCE_DIR" >> $GITHUB_OUTPUT
          echo "test_dir=$TEST_DIR" >> $GITHUB_OUTPUT
          echo "target_dir=$TARGET_DIR" >> $GITHUB_OUTPUT
          echo "project_base=$PROJECT_BASE" >> $GITHUB_OUTPUT
          
          echo "Detected paths:"
          echo "Source: $SOURCE_DIR"
          echo "Test: $TEST_DIR"
          echo "Target: $TARGET_DIR"
          echo "Project Base: $PROJECT_BASE"

      - name: SonarCloud Scan with dynamic paths
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ steps.find_paths.outputs.project_base }}
          args: |
            -Dsonar.projectKey=kless3_internship
            -Dsonar.projectName="User Service"
            -Dsonar.organization=kless31332
            -Dsonar.java.binaries=${{ steps.find_paths.outputs.target_dir }}/classes
            -Dsonar.sources=${{ steps.find_paths.outputs.source_dir }}
            -Dsonar.tests=${{ steps.find_paths.outputs.test_dir }}
            -Dsonar.junit.reportPaths=${{ steps.find_paths.outputs.target_dir }}/surefire-reports
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ steps.find_paths.outputs.target_dir }}/site/jacoco/jacoco.xml
            -Dsonar.sourceEncoding=UTF-8

      - name: Check Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        timeout-minutes: 10

  docker-build:
    name: Artifact Creation (Docker Image)
    runs-on: ubuntu-latest
    needs: sonarqube-analysis
    if: github.event_name == 'push' && (github.ref == 'refs/heads/user-service' || github.ref == 'refs/heads/dev')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build application
        run: |
          if [ -d "user-service" ]; then
            cd user-service
            mvn clean package -DskipTests
          else
            mvn clean package -DskipTests
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate deployment manifest
        run: |
          cat > docker-compose.ci.yml << EOF
          version: '3.8'
          services:
            app:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
              environment:
                - SPRING_PROFILES_ACTIVE=prod
                - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shopdb
                - DATABASE_USERNAME=shop_user
                - DATABASE_PASSWORD=shop_password
                - SPRING_DATA_REDIS_HOST=redis
              ports:
                - "8080:8080"
            postgres:
              image: postgres:16-alpine
              environment:
                - POSTGRES_DB=shopdb
                - POSTGRES_USER=shop_user
                - POSTGRES_PASSWORD=shop_password
            redis:
              image: redis:7.2-alpine
          EOF

      - name: Upload Docker artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-artifacts
          path: |
            docker-compose.ci.yml
          retention-days: 30