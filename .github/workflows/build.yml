name: CI Pipeline

on:
  push:
    branches: [ order-service ]
  pull_request:
    branches: [ order-service ]

env:
  REGISTRY: MaksimYafimchyk
  SERVICES: "auth-service user-service order-service"
  IMAGE_NAME: MaksimYafimchyk/internship

jobs:
  build-and-test:
    name: Build and Test Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        service: [ user-service, auth-service, order-service ]
        include:
          - service: auth-service
            db_name: auth
            db_schema: auth_schema
            build_tool: maven
          - service: user-service
            db_name: internship
            db_schema: user_schema
            build_tool: maven
          - service: order-service
            db_name: order_db
            db_schema: order_schema
            build_tool: gradle

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make gradlew executable (for order-service)
        if: matrix.service == 'order-service'
        run: |
          cd order-service
          chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ matrix.build_tool }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database and schema for ${{ matrix.service }}
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE ${{ matrix.db_name }};"
          
          psql postgresql://postgres:postgres@localhost:5432/${{ matrix.db_name }} -c "CREATE SCHEMA IF NOT EXISTS ${{ matrix.db_schema }};"
          
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "\l" | grep ${{ matrix.db_name }}
          psql postgresql://postgres:postgres@localhost:5432/${{ matrix.db_name }} -c "\dn" | grep ${{ matrix.db_schema }}

      - name: Build ${{ matrix.service }} with ${{ matrix.build_tool }}
        run: |
          cd ${{ matrix.service }}
          if [ "${{ matrix.build_tool }}" = "maven" ]; then
            mvn clean compile -DskipTests
          else
            ./gradlew compileJava -x test
          fi

      - name: Run tests with JaCoCo for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          if [ "${{ matrix.build_tool }}" = "maven" ]; then
            mvn clean test jacoco:report -Djacoco.destDir=target/site/jacoco
          else
            ./gradlew test jacocoTestReport
          fi

      - name: Verify database connectivity for ${{ matrix.service }}
        run: |
          echo "Testing connection to database: ${{ matrix.db_name }}"
          psql postgresql://postgres:postgres@localhost:5432/${{ matrix.db_name }} -c "SELECT current_database(), current_schema();"
          
          

  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build all services for Sonar
        run: |
          cd user-service && mvn clean verify -DskipTests
          cd ../auth-service && mvn clean verify -DskipTests
          

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          cd user-service
          mvn sonar:sonar \
            -Dsonar.organization=kless31332 \
            -Dsonar.projectKey=kless3_internship \
            -Dsonar.projectName='User Service' \
            -Dsonar.qualitygate.wait=false \
            -Dsonar.issue.ignore.multicriteria=e1 \
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=squid:S00116 \
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*
          
          cd ../auth-service
          mvn sonar:sonar \
            -Dsonar.organization=kless31332 \
            -Dsonar.projectKey=kless3_internship \
            -Dsonar.projectName='Auth Service' \
            -Dsonar.qualitygate.wait=false \
            -Dsonar.issue.ignore.multicriteria=e1 \
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=squid:S00116 \
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*

  docker-build:
    name: Artifact Creation (Docker Images)
    runs-on: ubuntu-latest
    needs: code-analysis
    if: github.event_name == 'push' && github.ref == 'refs/heads/order-service'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [ user-service, auth-service, order-service ]
        include:
          - service: auth-service
            build_tool: maven
            context: ./auth-service
          - service: user-service
            build_tool: maven
            context: ./user-service
          - service: order-service
            build_tool: gradle
            context: ./order-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ matrix.build_tool }}

      - name: Make gradlew executable (for order-service)
        if: matrix.service == 'order-service'
        run: |
          cd order-service
          chmod +x ./gradlew

      - name: Build ${{ matrix.service }} with ${{ matrix.build_tool }}
        run: |
          cd ${{ matrix.service }}
          if [ "${{ matrix.build_tool }}" = "maven" ]; then
            mvn clean package -DskipTests
          else
            ./gradlew build -x test
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate deployment manifest for ${{ matrix.service }}
        run: |
          cat > docker-compose-${{ matrix.service }}.yml << EOF
          version: '3.8'
          services:
            ${{ matrix.service }}:
              image: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
              environment:
                - SPRING_PROFILES_ACTIVE=prod
              ports:
                - "8080:8080"
              depends_on:
                - postgres
                - redis
            postgres:
              image: postgres:15-alpine
              environment:
                - POSTGRES_DB=postgres
                - POSTGRES_USER=postgres
                - POSTGRES_PASSWORD=postgres
            redis:
              image: redis:7-alpine
          EOF

      - name: Upload Docker artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-artifacts
          path: |
            docker-compose-*.yml
          retention-days: 30