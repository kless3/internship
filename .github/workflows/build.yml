name: CI Pipeline Optimized

on:
  push:
    branches: [ order-service ]
  pull_request:
    branches: [ order-service ]

jobs:
  build:
    name: Build Services
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        service: [user-service, auth-service, order-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          if [ -f "pom.xml" ]; then
            mvn clean compile -DskipTests -T 1C --no-transfer-progress
          elif [ -f "build.gradle" ]; then
            chmod +x gradlew
            ./gradlew clean classes -x test --no-daemon
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]

      redis:
        image: redis:7-alpine
        ports: [6379:6379]

    strategy:
      matrix:
        service: [user-service, auth-service, order-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Run Tests
        run: |
          cd ${{ matrix.service }}
          if [ -f "pom.xml" ]; then
            mvn test -DskipTests=false --no-transfer-progress
          elif [ -f "build.gradle" ]; then
            chmod +x gradlew
            ./gradlew test --no-daemon
          fi