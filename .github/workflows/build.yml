name: Build and Test

on:
  push:
    branches: [ order-service ]
  pull_request:
    branches: [ order-service ]

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'

      - name: Build Maven projects (auth-service + user-service)
        run: |
          cd innowise
          mvn -B -f auth-service/pom.xml clean compile
          mvn -B -f user-service/pom.xml clean compile

      - name: Build Gradle project (order-service)
        uses: gradle/gradle-build-action@v3
        with:
          arguments: |
            -p innowise/order-service clean build -x test

  test:
    name: Test Stage (Unit + Integration)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'

      - name: Wait for PostgreSQL & Redis
        run: |
          echo "⏳ Waiting for PostgreSQL and Redis to be ready..."
          for i in {1..20}; do
            (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1 && echo "✅ PostgreSQL up" && break
            sleep 3
          done
          for i in {1..20}; do
            (echo > /dev/tcp/localhost/6379) >/dev/null 2>&1 && echo "✅ Redis up" && break
            sleep 3
          done

      - name: Run tests for Maven projects
        run: |
          cd innowise
          mvn -B -f auth-service/pom.xml test
          mvn -B -f user-service/pom.xml test

      - name: Run tests for Gradle project
        uses: gradle/gradle-build-action@v3
        with:
          arguments: |
            -p innowise/order-service test
