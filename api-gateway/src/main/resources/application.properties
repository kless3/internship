spring.config.import=optional:file:.env[.properties]
spring.application.name=api-gateway

server.port=8083
jwt.secret=${JWT_SECRET}

services.authService=${SERVICES_AUTH_SERVICE:http://localhost:8081}
services.order-service=${SERVICES_ORDER_SERVICE:http://localhost:8082}
services.user-service=${SERVICES_USER_SERVICE:http://localhost:8080}
services.payment-service=${SERVICES_PAYMENT_SERVICE:http://localhost:8084}